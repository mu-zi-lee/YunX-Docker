name: macOS local edition
on:
  pull_request:
    paths: ['macos/**', 'desktop/src/**', 'server/src/**', '**/*.gradle.kts', '.github/workflows/macos.yml']
  push:
    branches: [main]
    tags: ['macos-v*']
    paths: ['macos/**', 'desktop/src/**', 'server/src/**', '**/*.gradle.kts', '.github/workflows/macos.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        shell: bash
        run: |
          version=$(tr -d '\r\n' < macos/version.txt)
          [[ "$version" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "macos-v$version" ]] || {
              echo "::error::The release tag must match macos/version.txt."
              exit 1
            }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  macos:
    needs: version
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'
      - name: Test and package Apple Silicon edition
        run: |
          test "$(uname -m)" = arm64
          gradle :macos:test :macos:createDistributable :macos:packageDmg --no-daemon
          lipo macos/build/compose/binaries/main/app/YunX.app/Contents/MacOS/YunX -verify_arch arm64
          codesign --verify --deep --strict macos/build/compose/binaries/main/app/YunX.app
          hdiutil verify macos/build/compose/binaries/main/dmg/*.dmg
      - name: Verify server compatibility
        run: gradle -p server test --no-daemon
      - name: Generate download checksum
        working-directory: macos/build/compose/binaries/main/dmg
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: shasum -a 256 "YunX-$VERSION-macos-arm64.dmg" > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: YunX-macOS-arm64
          path: |
            macos/build/compose/binaries/main/dmg/*.dmg
            macos/build/compose/binaries/main/dmg/SHA256SUMS
          if-no-files-found: error
  windows-regression:
    needs: version
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'
      - name: Verify original desktop compatibility
        run: gradle :desktop:test --no-daemon
  container-regression:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/macos-v')
    needs: version
    uses: ./.github/workflows/ci.yml
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/macos-v')
    needs: [version, macos, windows-regression, container-regression]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: YunX-macOS-arm64
          path: release-assets
      - name: Verify and publish test release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          cd release-assets
          sha256sum -c SHA256SUMS
          tag="macos-v$VERSION"
          asset="YunX-$VERSION-macos-arm64.dmg"
          if gh release view "$tag" --json isDraft,targetCommitish > release.json 2>/dev/null; then
            test "$(jq -r .targetCommitish release.json)" = "$GITHUB_SHA" || {
              echo "::error::The existing release belongs to a different commit."
              exit 1
            }
            if test "$(jq -r .isDraft release.json)" = false; then
              gh release download "$tag" --pattern "$asset" --pattern SHA256SUMS --dir existing
              (cd existing && sha256sum -c SHA256SUMS)
              echo "Release already published; verified existing assets and preserved them."
              exit 0
            fi
          else
            gh release create "$tag" --verify-tag --target "$GITHUB_SHA" --draft --prerelease \
              --title "YunX macOS v$VERSION · Apple Silicon 测试版" \
              --notes-file "$GITHUB_WORKSPACE/macos/RELEASE-NOTES.md"
          fi
          gh release upload "$tag" "$asset" SHA256SUMS --clobber
          gh release edit "$tag" --draft=false --prerelease --latest=false \
            --notes-file "$GITHUB_WORKSPACE/macos/RELEASE-NOTES.md"
