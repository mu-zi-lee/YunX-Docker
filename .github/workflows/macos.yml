name: macOS local edition
on:
  pull_request:
    paths: ['macos/**', 'desktop/src/**', 'server/src/**', '**/*.gradle.kts', '.github/workflows/macos.yml']
  push:
    branches: [main]
    paths: ['macos/**', 'desktop/src/**', 'server/src/**', '**/*.gradle.kts', '.github/workflows/macos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Test and package Apple Silicon edition
        run: |
          test "$(uname -m)" = arm64
          gradle :macos:test :macos:createDistributable :macos:packageDmg --no-daemon
          lipo -verify_arch arm64 macos/build/compose/binaries/main/app/YunX.app/Contents/MacOS/YunX
          codesign --verify --deep --strict macos/build/compose/binaries/main/app/YunX.app
          hdiutil verify macos/build/compose/binaries/main/dmg/*.dmg
      - name: Verify server compatibility
        run: gradle -p server test --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: YunX-macOS-arm64
          path: macos/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error
  windows-regression:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Verify original desktop compatibility
        run: gradle :desktop:test --no-daemon
